# --- JVM ---
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m

# --- Build performance ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# configureondemand is deprecated in Gradle 9 and conflicts with the
# configuration cache, so it is deliberately not set.

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# --- Kotlin / KSP ---
kotlin.code.style=official
android.disallowKotlinSourceSets=false
ksp.allow.all.files.for.all.processors=true

# --- PekSeries build switches ---
# When true the dev flavor installs as az.pekstudios.pekseries.debug, side by
# side with the Play Store build. Requires a matching Android app registered in
# the Firebase console first, otherwise google-services fails the build with
# "No matching client found for package name".
pekseries.devSeparateApplicationId=false
