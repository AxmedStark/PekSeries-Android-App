# App version. Read at configuration time by build-logic and applied to the
# application module. This file is committed on purpose: it is not a secret, and
# it is the authoritative record of what version each commit produced.
#
#   versionCode = MAJOR*100_000_000 + MINOR*100_000 + PATCH*1_000 + BUILD
#   versionName = MAJOR.MINOR.PATCH.BUILD
#
# CI bumps VERSION_BUILD on every pipeline run. The other three are bumped by
# hand when cutting a release. Google Play rejects any upload whose versionCode
# is not strictly greater than the previously published one.
VERSION_MAJOR=1
VERSION_MINOR=11
VERSION_PATCH=1
VERSION_BUILD=63
