name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push to the same branch cancels the previous run.
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Secrets are exported as environment variables rather than written to a
      # file: build-logic reads the environment first, so nothing sensitive ever
      # lands on the runner's disk.
      #
      # google-services.json is the exception - the Google Services plugin can
      # only read a file - so it is materialised from a base64 secret and
      # removed again once the build finishes.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Assemble devDebug
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleDevDebug

      - name: Unit tests
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew test

      - name: Lint
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew lintDevDebug

      # Proves R8 has not broken Gson/Room reflection. The release variant went
      # unbuilt for months before 1.9.0 and did not even compile.
      - name: Assemble prodRelease (verifies R8)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew assembleProdRelease

      - name: Publish test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/test*UnitTest/TEST-*.xml'
          check_name: Unit test results

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Remove google-services.json
        if: always()
        run: rm -f app/google-services.json
