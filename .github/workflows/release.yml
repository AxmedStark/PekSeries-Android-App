name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PEKSERIES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::PEKSERIES_KEYSTORE_BASE64 is not set; the bundle would be unsigned."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # VERSION_BUILD is bumped from the run number so every upload gets a
      # strictly greater versionCode, which Google Play requires. The three
      # semantic components stay under human control in version.properties.
      - name: Stamp build number
        run: |
          sed -i "s/^VERSION_BUILD=.*/VERSION_BUILD=${GITHUB_RUN_NUMBER}/" version.properties
          cat version.properties

      - name: Build signed bundle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PEKSERIES_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          PEKSERIES_KEYSTORE_PASSWORD: ${{ secrets.PEKSERIES_KEYSTORE_PASSWORD }}
          PEKSERIES_KEY_ALIAS: ${{ secrets.PEKSERIES_KEY_ALIAS }}
          PEKSERIES_KEY_PASSWORD: ${{ secrets.PEKSERIES_KEY_PASSWORD }}
        run: ./gradlew bundleProdRelease

      - name: Verify the bundle is actually signed
        run: |
          BUNDLE=$(find app/build/outputs/bundle/prodRelease -name '*.aab' | head -1)
          echo "Bundle: $BUNDLE"

          # Verified locally against both a signed and an unsigned bundle:
          #   - an unsigned .aab keeps the same filename, so the name proves nothing
          #   - `jarsigner -verify` exits 0 even when unsigned (it just prints
          #     "no manifest."), so the exit code proves nothing either
          # Only the presence of "jar verified" in the output is reliable.
          if ! jarsigner -verify "$BUNDLE" | grep -q "jar verified"; then
            echo "::error::Bundle is NOT signed - Play would reject it."
            jarsigner -verify "$BUNDLE" || true
            exit 1
          fi
          echo "Bundle is signed."
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"

      - name: Upload bundle and mapping as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-release
          path: |
            app/build/outputs/bundle/prodRelease/*.aab
            app/build/outputs/mapping/prodRelease/mapping.txt
          retention-days: 90

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: az.pekstudios.pekseries
          releaseFiles: ${{ env.BUNDLE_PATH }}
          track: ${{ inputs.track || 'internal' }}
          status: completed
          # Lets Play symbolicate R8-obfuscated crash reports.
          mappingFile: app/build/outputs/mapping/prodRelease/mapping.txt

      - name: Clean up secrets from the runner
        if: always()
        run: rm -f app/google-services.json "$RUNNER_TEMP/upload.jks"
